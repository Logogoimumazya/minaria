name = "astral-tarot-oracle"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
# comma-separated list of sites allowed to call the oracle
ALLOWED_ORIGINS = "https://astral-tarot.pages.dev,https://logogoimumazya.github.io"
# tried in order; a model that is overloaded (503), retired (404) or out of quota (429) hands over to the next.
# 2026-10-28: gemini-flash-latest (3.8) answered 503 after 20-40 s, gemini-3.5-flash answered in ~6 s
GEMINI_MODEL = "gemini-3.5-flash,gemini-flash-latest,gemini-flash-lite-latest"
# per-visitor daily caps; "0" = no cap (2026-11-21: the page says there is no count limit, the API sets the pace)
READING_LIMIT = "0"
CHAT_LIMIT = "0"
# site-wide ceiling per day, kept under the free tier's daily request limit
DAILY_CAP = "1000"
# usage log in D1 (schema.sql); "0" turns it off. LOG_SALT is a secret: wrangler secret put LOG_SALT
LOG_ENABLED = "1"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# usage log: what people ask and what the oracle answered (no name, birth date or IP)
[[d1_databases]]
binding = "DB"
database_name = "astral-tarot-usage"
database_id = "f729396e-2e3b-46e4-8270-fe56c1b7b627"
