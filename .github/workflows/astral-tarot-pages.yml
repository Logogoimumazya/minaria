name: Deploy Astral Tarot to GitHub Pages

on:
  push:
    branches: [claude/cloud-session-setup-btn8do, claude/exciting-babbage-llebqn]
    paths: ["apps/astral-tarot/**", ".github/workflows/astral-tarot-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        env:
          # the Cloudflare Worker that reaches Gemini; leave the repository variable unset to use the house book only
          ORACLE_URL: ${{ vars.ORACLE_URL }}
        run: python3 apps/astral-tarot/build_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
